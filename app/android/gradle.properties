org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 只发布 arm64-v8a（2019 年后的 Android 设备都是 arm64，包体显著更小）。
#
# 为什么必须显式关掉：Flutter 的 Gradle 插件会按 `target-platform` 推导出 ABI 列表
# （默认 android-arm / android-arm64 / android-x64），然后**清空**我们在
# app/build.gradle.kts 的 defaultConfig 里写的 abiFilters（见 FlutterPlugin 的
# configureAbiWithoutSplits）。不关掉这个开关，那边的 abiFilters 就是摆设 ——
# 实测产物里会同时出现 arm64-v8a、armeabi-v7a、x86_64 三套 .so。
#
# 关掉之后：app/build.gradle.kts 里的 abiFilters 生效；CI 另外显式传
# `--target-platform android-arm64`，以免再去编译用不上的 ABI。
disable-abi-filtering=true
