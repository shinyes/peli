name: Release APK

# 打版本 tag（`v0.1.0` 这类）即编译 release 包，并把它挂到 GitHub Release 上。
# 也支持手动触发（Actions → Release APK → Run workflow），便于首次验证流水线。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限；其余权限一律不给。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与本地开发一致（见 README「工具链」）；升级 Flutter 时同步改这里。
  FLUTTER_VERSION: '3.44.9'
  # 项目在 app/android/app/build.gradle.kts 里固定了 NDK 版本，构建前显式装好。
  NDK_VERSION: '28.2.13676358'
  COMPILE_SDK: '36'

jobs:
  release:
    name: 编译并发布 release APK
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$COMPILE_SDK.0.0" \
            "ndk;$NDK_VERSION"

      - name: 解析依赖
        run: flutter pub get

      - name: 静态检查与测试
        run: |
          set -euo pipefail
          (cd packages/memos_api && dart test)
          (cd app && flutter analyze --no-pub)
          (cd app && flutter test --no-pub)

      # 签名材料**不进仓库**（key.properties 与 *.jks 都在 .gitignore 里），
      # 由仓库 secrets 注入。缺任何一个就立刻失败：否则 build.gradle.kts 会静默
      # 回退到 debug 签名，产出一个不能对外发布的"release"包。
      - name: 写入签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secrets:$missing"
            echo "::error::请在 Settings → Secrets and variables → Actions 中配置（生成方式见 README「打 tag 自动发版」）。"
            exit 1
          fi
          # storeFile 相对 android/app/ 解析，与本地 key.properties 保持一致。
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/android/app/memos-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=memos-release.jks"
          } > app/android/key.properties

      - name: 编译 release APK
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # tag v1.2.3 → versionName 1.2.3；versionCode 用 run number（单调递增，
          # 覆盖安装时不会被系统拒绝）。
          NAME="${REF_NAME#v}"
          args=(--release --build-number "$RUN_NUMBER")
          if [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--build-name "$NAME")
          fi
          cd app
          flutter build apk "${args[@]}"

      - name: 校验产物（加密链路 + 签名非 debug）
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          (cd app && dart run tool/verify_apk_encryption.dart build/app/outputs/flutter-apk/app-release.apk)
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          if "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -qi 'CN=Android Debug'; then
            echo "::error::产物是 debug 签名 —— 说明签名材料没有生效"
            exit 1
          fi
          {
            echo "### Peli release APK"
            echo ""
            echo "- 版本：${REF_NAME:-local} (build $RUN_NUMBER)"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
            echo "- SHA256：\`$(sha256sum "$APK" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: peli-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发时执行）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
